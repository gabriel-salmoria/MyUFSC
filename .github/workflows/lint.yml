name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job id stays `lint` on purpose: it is the name any existing required status
  # check on `main` is keyed to, and renaming it would leave PRs waiting on a
  # check that never reports. The job itself now covers lint + types + tests.
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      # `pnpm run lint` does not typecheck — eslint-config-next's TypeScript
      # rules are syntactic. Without this a type error only surfaces at build.
      - name: Typecheck
        if: '!cancelled()'
        run: pnpm exec tsc --noEmit

      # The suite exists but nothing was gating on it.
      - name: Run tests
        if: '!cancelled()'
        run: pnpm test
