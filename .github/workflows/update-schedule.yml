name: Update Schedule

on:
  schedule:
    - cron: '0 8 * * *'  # Every day at 08:00 UTC
  workflow_dispatch:         # Allow manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write   # for the keepalive step below

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            scrapers/schedule/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('scrapers/schedule/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run curriculum update
        env:
          NEON_URL: ${{ secrets.NEON_URL }}
        run: pnpm run curriculum:update

      # professor_courses is derived from the schedules; it must be rebuilt
      # after every schedule update (one transaction: TRUNCATE + re-insert).
      - name: Sync professor-course pairs
        env:
          NEON_URL: ${{ secrets.NEON_URL }}
        run: pnpm exec tsx scripts/update-professors.ts

      # GitHub disables scheduled workflows after 60 days without a push to
      # the repo (this one stopped on 2026-10-23). Re-enabling it through the
      # API on every run resets that clock.
      - name: Keep this scheduled workflow enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-schedule.yml/enable"
